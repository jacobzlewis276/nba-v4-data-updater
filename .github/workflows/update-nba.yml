
name: Update NBA Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

jobs:
  update-nba:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow fsspec huggingface_hub

      - name: Download and convert NBA data
        run: python update_nba.py

      - name: Run NBA historical backtest
        run: python backtest_nba.py


      - name: Run NBA matchup comparison backtest
        run: python backtest_matchups.py

      - name: Optimize NBA matchup strength
        run: python optimize_matchups.py

      - name: Evaluate NBA probability calibration
        run: python calibrate_nba.py


      - name: Run NBA walk-forward validation
        run: python walkforward_nba.py

      - name: Publish CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f data/backtest_matchup_comparison.csv
          git add data/*.csv
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update NBA game logs and backtest"
            git push
          fi
